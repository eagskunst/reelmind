[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelmind"
version = "0.1.0"
description = "Local-first library of saved TikTok/Instagram videos you can ask questions about"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "yt-dlp>=2026.8.19",
    "curl-cffi~=0.16.3",  # enables yt-dlp --impersonate (TikTok blocks plain requests)
    "faster-whisper~=1.2.1",
    "av~=18.1",  # av>=19 dropped the metadata_errors kwarg faster-whisper 1.2.x passes
    "openai~=3.19.2",
    "pydantic~=2.13.5",
    "typer~=0.27.2",
    "rich~=15.0.0",
    "fastapi~=0.141.1",
    "uvicorn~=0.53.0",
]

[project.scripts]
reelmind = "reelmind.cli:app"

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.16.9",
    "mypy~=2.3.1",
    "httpx~=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reelmind"]

[tool.hatch.build.targets.wheel.force-include]
"src/reelmind/web/static" = "reelmind/web/static"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["reelmind"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
