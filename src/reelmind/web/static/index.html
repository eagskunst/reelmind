<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reelmind</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --accent:#4f46e5; --card:#fff; --border:#e5e5e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1c1c1e; --border:#333; --accent:#818cf8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:860px; margin:0 auto; padding:1.5rem 1rem 4rem; }
  h1 { font-size:1.4rem; margin:0 0 1rem; }
  .askbox { display:flex; gap:.5rem; }
  .askbox input { flex:1; padding:.75rem 1rem; font-size:1rem; border:1px solid var(--border); border-radius:.6rem; background:var(--card); color:var(--fg); }
  button { padding:.6rem 1rem; border:0; border-radius:.6rem; background:var(--accent); color:#fff; cursor:pointer; font-size:.95rem; }
  button:disabled { opacity:.5; }
  #answer { margin-top:1rem; padding:1rem; background:var(--card); border:1px solid var(--border); border-radius:.6rem; display:none; line-height:1.5; }
  #answer a { color:var(--accent); word-break:break-all; }
  .bar { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.25rem 0; align-items:center; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chip { padding:.3rem .8rem; border:1px solid var(--border); border-radius:999px; background:var(--card); color:var(--fg); cursor:pointer; font-size:.85rem; }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .bar input[type=search] { padding:.45rem .8rem; border:1px solid var(--border); border-radius:.6rem; background:var(--card); color:var(--fg); }
  details.add { margin:1rem 0; }
  details.add textarea { width:100%; min-height:5rem; margin-top:.5rem; padding:.5rem; border:1px solid var(--border); border-radius:.5rem; background:var(--card); color:var(--fg); font-family:inherit; }
  .grid { display:grid; gap:.8rem; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); margin-top:1rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:.7rem; padding:.9rem; }
  .card h3 { margin:0 0 .3rem; font-size:1rem; }
  .badge { display:inline-block; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; background:var(--accent); color:#fff; padding:.15rem .5rem; border-radius:.4rem; margin-bottom:.4rem; }
  .card p { margin:.3rem 0; font-size:.88rem; color:var(--muted); }
  .card ul { margin:.3rem 0; padding-left:1.1rem; font-size:.85rem; }
  .card a { color:var(--accent); font-size:.85rem; word-break:break-all; }
  .undated { color:#b45309; font-size:.8rem; }
  #status { font-size:.8rem; color:var(--muted); margin-top:.5rem; }
</style>
</head>
<body>
<main>
  <h1>reelmind</h1>

  <div class="askbox">
    <input id="q" type="text" placeholder="Ask about your saved videos… e.g. what restaurant can I go to?">
    <button id="askBtn">Ask</button>
  </div>
  <div id="answer"></div>
  <div class="grid" id="answerGrid"></div>

  <details class="add">
    <summary>Add links</summary>
    <textarea id="addUrls" placeholder="One URL per line (video or list/collection links)"></textarea>
    <button id="addBtn">Add</button>
    <div id="status"></div>
  </details>

  <div class="bar">
    <div class="chips" id="chips"></div>
    <input id="search" type="search" placeholder="Search…">
    <label style="font-size:.85rem"><input id="upcoming" type="checkbox"> upcoming events</label>
  </div>

  <div class="grid" id="grid"></div>
</main>
<script>
const grid = document.getElementById('grid');
const answerBox = document.getElementById('answer');
const answerGrid = document.getElementById('answerGrid');
const chips = document.getElementById('chips');
const search = document.getElementById('search');
const upcoming = document.getElementById('upcoming');
const statusEl = document.getElementById('status');
let activeCat = null;

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u){
  try { const p = new URL(u); return (p.protocol === 'http:' || p.protocol === 'https:') ? u : '#'; }
  catch { return '#'; }
}
// build answer DOM without innerHTML: text nodes, <br>, and safe <a> elements
function renderAnswer(box, text){
  box.textContent = '';
  const frag = document.createDocumentFragment();
  const parts = String(text || '').split(/(https?:\/\/[^\s<>"']+)/g);
  for (const part of parts){
    if (/^https?:\/\//.test(part)){
      const a = document.createElement('a');
      a.href = safeUrl(part); a.textContent = part;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      frag.appendChild(a);
    } else {
      const lines = part.split('\n');
      lines.forEach((line, i) => {
        if (i > 0) frag.appendChild(document.createElement('br'));
        frag.appendChild(document.createTextNode(line));
      });
    }
  }
  box.appendChild(frag);
}
function renderCard(v){
  const points = (v.key_points||[]).slice(0,3);
  return `<div class="card">
    <span class="badge">${esc(v.category)}</span>
    <h3>${esc(v.title || v.url)}</h3>
    <p>${esc(v.summary)}</p>
    ${v.places?.length ? `<ul>${v.places.map(p=>`<li>📍 ${esc(p.name)}${p.city?', '+esc(p.city):''}</li>`).join('')}</ul>` : ''}
    ${v.events?.length ? `<ul>${v.events.map(e=>`<li>🗓 ${esc(e.name)}${e.start_date?' — '+esc(e.start_date):''}${(!e.start_date&&!e.end_date)?' <span class="undated">(date unknown)</span>':''}${e.city?', '+esc(e.city):''}</li>`).join('')}</ul>` : ''}
    ${points.length ? `<ul>${points.map(k=>`<li>✓ ${esc(k)}</li>`).join('')}</ul>` : ''}
    <a href="${safeUrl(v.url)}" target="_blank" rel="noopener noreferrer">open video ↗</a>
  </div>`;
}

async function initChips() {
  const res = await fetch('/api/config');
  const conf = await res.json();
  (conf.categories || []).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c.replaceAll('_',' ');
    b.dataset.cat = c;
    b.onclick = () => { activeCat = (activeCat === c ? null : c);
      [...chips.children].forEach(x => x.classList.toggle('active', x.dataset.cat === activeCat));
      load(); };
    chips.appendChild(b);
  });
}

async function load() {
  const p = new URLSearchParams();
  if (activeCat) p.set('category', activeCat);
  if (search.value) p.set('q', search.value);
  if (upcoming.checked) p.set('upcoming', 'true');
  const res = await fetch('/api/videos?' + p);
  const vids = await res.json();
  grid.innerHTML = vids.map(renderCard).join('') || '<p>No videos yet. Add some links above.</p>';
}

document.getElementById('askBtn').onclick = async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  answerBox.style.display = 'block'; answerBox.textContent = 'Thinking…';
  answerGrid.innerHTML = '';
  const res = await fetch('/api/ask', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({question:q})});
  const data = await res.json();
  renderAnswer(answerBox, data.answer);
  if (data.relaxed && data.videos?.length) {
    const p = document.createElement('p');
    p.className = 'undated';
    p.textContent = `(relaxed ${data.relaxed} filter to find these)`;
    answerBox.appendChild(p);
  }
  answerGrid.innerHTML = (data.videos || []).map(renderCard).join('');
};

let pollTimer = null;
async function pollStatus() {
  const res = await fetch('/api/status');
  const s = await res.json();
  if (s.pending > 0) {
    statusEl.textContent = `${s.pending} processing, ${s.failed} failed`;
    pollTimer = setTimeout(pollStatus, 3000);
  } else {
    statusEl.textContent = s.failed ? `${s.failed} failed` : '';
    pollTimer = null;
    load();
  }
}

document.getElementById('addBtn').onclick = async () => {
  const urls = document.getElementById('addUrls').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!urls.length) return;
  const res = await fetch('/api/add', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({urls})});
  const data = await res.json();
  statusEl.textContent = `Enqueued ${data.enqueued} new video(s)` + (data.lists ? `, ${data.lists} list(s) expanding` : '');
  document.getElementById('addUrls').value = '';
  if (!pollTimer) pollTimer = setTimeout(pollStatus, 1000);
};

search.addEventListener('input', () => load());
upcoming.addEventListener('change', () => load());
initChips().then(load);
pollStatus();
</script>
</body>
</html>
